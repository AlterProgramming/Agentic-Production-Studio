name: Validate live intent studio

on:
  push:
    branches:
      - main
    paths:
      - studio_runtime/**
      - studio_console/**
      - tools/studio_console.py
      - tools/openai_reference_recreation_adapter.py
      - tools/openai_video_shot_adapter.py
      - tools/video_project.py
      - contracts/intent-event.schema.json
      - contracts/video-project.schema.json
      - tests/test_studio_runtime.py
      - tests/test_video_runtime.py
      - docs/live-intent-studio.md
      - docs/reference-recreation.md
      - docs/video-native-runtime.md
      - examples/ff7-intermission-video-project.json
      - .github/workflows/validate-live-intent-studio.yml
  pull_request:
    paths:
      - studio_runtime/**
      - studio_console/**
      - tools/studio_console.py
      - tools/openai_reference_recreation_adapter.py
      - tools/openai_video_shot_adapter.py
      - tools/video_project.py
      - contracts/intent-event.schema.json
      - contracts/video-project.schema.json
      - tests/test_studio_runtime.py
      - tests/test_video_runtime.py
      - docs/live-intent-studio.md
      - docs/reference-recreation.md
      - docs/video-native-runtime.md
      - examples/ff7-intermission-video-project.json
      - .github/workflows/validate-live-intent-studio.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install pytest
      - run: >-
          python3 -m py_compile
          studio_runtime/events.py
          studio_runtime/recreation.py
          studio_runtime/video.py
          studio_runtime/server.py
          tools/studio_console.py
          tools/openai_reference_recreation_adapter.py
          tools/openai_video_shot_adapter.py
          tools/video_project.py
      - run: python3 -m json.tool contracts/intent-event.schema.json >/dev/null
      - run: python3 -m json.tool contracts/video-project.schema.json >/dev/null
      - run: python3 -m pytest -q tests/test_studio_runtime.py tests/test_video_runtime.py
