name: Validate Command Center binding

on:
  push:
    branches:
      - main
    paths:
      - .agent/command-center.json
      - AGENTS.md
      - scripts/validate_command_center_binding.py
      - .github/workflows/validate-command-center-binding.yml
  pull_request:
    paths:
      - .agent/command-center.json
      - AGENTS.md
      - scripts/validate_command_center_binding.py
      - .github/workflows/validate-command-center-binding.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile scripts/validate_command_center_binding.py
      - run: python3 scripts/validate_command_center_binding.py
