name: Validate ObjectForge Scope 5

on:
  pull_request:
    paths:
      - 'objectforge/**'
      - '.github/workflows/objectforge-scope5.yml'

permissions:
  contents: read

jobs:
  scope5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e 'objectforge[test,preview]'
      - run: pytest -q objectforge/tests/test_scope5.py
      - run: python -m objectforge.scope5 --output /tmp/objectforge-scope5
      - name: Validate Scope 5 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/objectforge-scope5')
          index = json.loads((root / 'scope5-index.json').read_text())
          assert index['status'] == 'passed', index
          assert index['part_plan_count'] == 6, index
          assert index['tolerance_stack_count'] == 9, index
          assert index['assembly_operation_count'] >= 14, index
          assert index['service_procedure_count'] >= 4, index
          assert index['validation']['all_tolerance_stacks_pass'] is True, index
          for name in ('manufacturing-plan.json', 'tolerance-stacks.json', 'assembly-sequence.json', 'service-plan.json', 'cost-envelope.json'):
              assert (root / name).stat().st_size > 100, name
          PY
      - run: python -m objectforge.scope4 --output /tmp/objectforge-scope4-regression
      - run: test "$(python -c "import json; print(json.load(open('/tmp/objectforge-scope4-regression/scope4-index.json'))['status'])")" = passed
      - name: Package Scope 5 evidence
        run: |
          cd /tmp
          zip -qr objectforge-scope5-delivery.zip objectforge-scope5
      - uses: actions/upload-artifact@v4
        with:
          name: objectforge-scope5-delivery
          path: |
            /tmp/objectforge-scope5
            /tmp/objectforge-scope5-delivery.zip
          if-no-files-found: error
          retention-days: 14
