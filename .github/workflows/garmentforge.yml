name: Validate GarmentForge clothing construction
on:
  push:
    branches: [agent/garmentforge-clothing-construction]
  pull_request:
    paths:
      - 'garmentforge/**'
      - 'capabilities/garment-construction/**'
      - 'benchmarks/garment-construction/**'
      - '.github/workflows/garmentforge.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch attributed CesiumMan reference asset
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/CesiumMan/glTF-Binary/CesiumMan.glb \
            --output CesiumMan.glb
          test "$(stat -c%s CesiumMan.glb)" -eq 490956
          sha256sum CesiumMan.glb > CesiumMan.glb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cesium-man-source-asset
          path: |
            CesiumMan.glb
            CesiumMan.glb.sha256
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ./garmentforge pytest
      - run: python -m pytest -q garmentforge/tests
      - run: python -m garmentforge.cli --output build/garmentforge
      - uses: actions/upload-artifact@v4
        with:
          name: garmentforge-verification-package
          path: build/garmentforge
