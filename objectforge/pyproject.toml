[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "objectforge"
version = "0.3.0"
description = "First-party procedural construction of detailed standalone GLB assets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "trimesh>=4.8,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
preview = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["objectforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
